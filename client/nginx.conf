# faisalwani.dev. Canonical host is https://www.faisalwani.dev (matches <link rel="canonical">).

# Cache policy by path: hashed build assets never change, HTML always revalidates.
map $uri $cache_control {
    default                    "no-cache";
    ~^/assets/                 "public, max-age=31536000, immutable";
    ~^/(?:logos|og|icons)/     "public, max-age=604800";
    ~^/(?:logo[^/]*\.(?:svg|jpg)|favicon\.ico)$ "public, max-age=604800";
}

# HTTP -> HTTPS on the canonical host
server {
    listen 80;
    server_name faisalwani.dev www.faisalwani.dev;
    return 301 https://www.faisalwani.dev$request_uri;
}

# bare domain -> www
server {
    listen 443 ssl;
    http2 on;
    server_name faisalwani.dev;

    ssl_certificate /etc/nginx/ssl/faisalwani.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/faisalwani.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.faisalwani.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.faisalwani.dev;

    ssl_certificate /etc/nginx/ssl/faisalwani.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/faisalwani.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    server_tokens off;

    # The build writes .gz next to every text asset (scripts/prerender.mjs); gzip on covers anything else.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Every header lives here: an add_header inside a location would drop all of these for that location.
    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Prerendered pages: / is index.html, /projects/<id> is projects/<id>.html, /admin is the
    # empty noindex shell admin.html. Unknown paths get a real 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The 404 page is the same shell; the app sends the visitor home.
    error_page 404 /app.html;

    location /api-proxy/ {
        proxy_pass http://server:8888;
        rewrite ^/api-proxy/(.*)$ /$1 break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
